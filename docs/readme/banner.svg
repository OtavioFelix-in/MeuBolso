<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#154D37"/>
    <stop offset="0.45" stop-color="#0B2A1F"/>
    <stop offset="1" stop-color="#050605"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#2CCB71" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#2CCB71" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="barg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#59E997"/>
    <stop offset="1" stop-color="#158C43"/>
  </linearGradient>
  <clipPath id="round"><rect width="1280" height="400" rx="28"/></clipPath>
  <clipPath id="iconclip"><rect x="96" y="112" width="176" height="176" rx="40"/></clipPath>
</defs>
<style>
  .shine { animation: shine 5s ease-in-out infinite; }
  @keyframes shine { 0%,100% { fill-opacity: 1; } 50% { fill-opacity: .72; } }
  .glow { animation: pulse 6s ease-in-out infinite; transform-origin: 1060px 200px; }
  .bar { transform-box: fill-box; transform-origin: bottom; animation: grow 3.6s cubic-bezier(.2,.8,.2,1) infinite; }
  .coin { animation: float 4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
  @keyframes grow { 0% { transform: scaleY(.15); } 35%,80% { transform: scaleY(1); } 100% { transform: scaleY(.15); } }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
  @keyframes fadein { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: none; } }
  text { font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
</style>
<g clip-path="url(#round)">
  <rect width="1280" height="400" fill="url(#bg)"/>
  <circle class="glow" cx="1060" cy="200" r="330" fill="url(#glow)"/>
  <path d="M0 360 C 260 320, 520 395, 780 350 S 1130 300, 1280 340 L1280 400 L0 400 Z" fill="#59E997" fill-opacity="0.05"/>
  <rect class="bar" style="animation-delay:0.00s" x="930" y="260" width="26" height="70" rx="7" fill="url(#barg)" /><rect class="bar" style="animation-delay:0.15s" x="972" y="220" width="26" height="110" rx="7" fill="url(#barg)" /><rect class="bar" style="animation-delay:0.30s" x="1014" y="240" width="26" height="90" rx="7" fill="url(#barg)" /><rect class="bar" style="animation-delay:0.45s" x="1056" y="180" width="26" height="150" rx="7" fill="url(#barg)" /><rect class="bar" style="animation-delay:0.60s" x="1098" y="205" width="26" height="125" rx="7" fill="url(#barg)" /><rect class="bar" style="animation-delay:0.75s" x="1140" y="145" width="26" height="185" rx="7" fill="url(#barg)" /><rect class="bar" style="animation-delay:0.90s" x="1182" y="170" width="26" height="160" rx="7" fill="url(#barg)" />
  <g class="coin">
    <circle cx="1205" cy="105" r="26" fill="#59E997"/>
    <circle cx="1205" cy="105" r="18" fill="none" stroke="#0B2A1F" stroke-width="4"/>
    <text x="1205" y="113" text-anchor="middle" font-size="22" font-weight="800" fill="#0B2A1F">$</text>
  </g>
  <g class="icon">
    <image clip-path="url(#iconclip)" x="96" y="112" width="176" height="176" href="data:image/png;base64,"/>
    <rect x="96" y="112" width="176" height="176" rx="40" fill="none" stroke="#59E997" stroke-opacity=".25" stroke-width="2"/>
  </g>
  <text class="fade1" x="312" y="190" font-size="76" font-weight="800" fill="#EDEDEF">Meu <tspan class="shine" fill="#59E997">Bolso</tspan></text>
  <text class="fade2" x="316" y="240" font-size="26" font-weight="500" fill="#C7CDC9">Controle financeiro pessoal, 100% offline.</text>
  <g class="fade3">
    <rect x="316" y="268" width="369" height="40" rx="20" fill="#59E997" fill-opacity=".12" stroke="#59E997" stroke-opacity=".35"/>
    <text x="334" y="294" font-size="17" font-weight="600" fill="#59E997">React Native · Expo · SQLite · Android</text>
  </g>
</g>
</svg>
